[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privshield"
version = "2.0.0"
description = "数盾 (PrivShield): 数联天下企业级数据隐私计算、多原语脱敏与三层动态分类分级治理边车 (Privacy Governance Sidecar)"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "grpcio>=1.82.1,<2.0.0",
    "protobuf>=7.35.0,<8.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "limits>=3.10.0",
    "cryptography>=42.0.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.20.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0,<4.0.0",
    "pyarrow>=14.0.0,<26.0.0",
    "scipy>=1.12.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    # IAM/MFA 口令散列（等保三级 bcrypt cost=12）；auth 模块运行时必需。
    "bcrypt>=4.1,<5",
]

[project.urls]
Homepage = "https://github.com/fengzhizi319/privacy-engine-python"
Repository = "https://github.com/fengzhizi319/privacy-engine-python.git"
Documentation = "https://github.com/fengzhizi319/privacy-engine-python#readme"

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.82.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "scipy>=1.12.0,<2.0.0",
    "locust>=2.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
observability = [
    # 可观测性相关依赖：仅在需要 OpenTelemetry / OTLP 导出时安装。
    # 这样可以避免核心 REST/gRPC 路径引入额外运行时开销。
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-grpc>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
]
sm2 = [
    # SM2 验签/签发适配层：仅当集群会话需要与 Go 侧 SM2 证书互操作时安装。
    # 纯 Python gmssl 仅用于测试回退，生产 C 绑定见 docs/auth.md。
    "gmssl-python>=0.1.0",
]
ml = [
    # ML 相关依赖全部保持“可选”，用于专精 LLM 分类、NER 和模型推理。
    # 设计目标是：缺少这些包时，服务仍能启动，并自动退化到规则/轻量实现，
    # 方便本地开发、CI，以及不需要大模型的部署环境。
    "torch>=2.2.0",
    # transformers 必须 >=5.14.0：Qwen3.5（qwen3_next 混合注意力架构）仅在 5.x 注册，
    # 4.x 加载 .models/Qwen3.5-0.8B-Privacy-Classifier-Smoother 会报 KeyError: 'qwen3_5'。
    # 注意 transformers 5.x 要求 huggingface_hub>=1.x，旧版 0.x API 不兼容。
    "transformers>=5.14.0",
    "huggingface_hub>=1.27.0",
    "accelerate>=0.30.0",
    "onnxruntime>=1.17.0",
    "pillow>=10.2.0",
    # ── Layer-3 Qwen3.5 本地 PyTorch 推理必备依赖 ──
    # Qwen3_5ForCausalLM 加载时硬依赖 einops，缺失会 ModuleNotFoundError 导致加载失败
    "einops>=0.8.0",
    # flash-linear-attention（fla）：Qwen3.5 混合架构线性注意力层所需 triton kernel，
    # 缺失时 transformers 回退到纯 PyTorch 实现，可能产生损坏/截断的 JSON 生成
    "fla-core>=0.5.2",
    # 可选（fast-path 加速）：causal-conv1d 为 mamba/conv 层提供 CUDA fast-path，缺失仅影响性能不影响正确性。
    # triton 由 torch 管理；WSL 下若出现 "0 active drivers" 错误请降级 triton==3.6.0，
    # 详见 docs/dynclassification/cuda_sm120_setup.md 第 6 节。
    # ModelScope Small-NER 推理后端（可选，缺失时 NER 层自动降级；datasets 为其运行时依赖）
    "modelscope>=1.20.0",
    "datasets>=4.0.0,<=4.8.4",
    # modelscope 在较新版本中未显式声明的传递依赖，直接列出以保证离线/干净环境可加载
    "addict>=2.4.0",
    "sortedcontainers>=2.4.0",
    "yapf>=0.32.0",
    "oss2>=2.17.0",
    "simplejson>=3.3.0",
]
docs = [
    # 文档站点构建依赖：仅在生成 MkDocs 文档时需要。
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

# ── Ruff (lint + format) ─────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["engine", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # assert allowed in tests
    "S104",   # bind to all interfaces (needed for container)
    # S311：项目中部分差分隐私（DP）噪声生成需要可重复、可控的伪随机源，
    # 并非用于密码学场景，因此不强制替换为密码学安全 RNG。
    "S311",   # pseudo-random generators OK for DP noise
    # S324：有些非安全用途（例如数据索引、兼容性哈希或轻量标识）会使用 MD5/SHA1，
    # 这里明确豁免，避免后续自动修复把这些实现误改成更重但不必要的方案。
    "S324",   # hashlib.md5/sha1 OK for non-security use
    "B008",   # function calls in defaults (FastAPI Depends)
    "B905",   # zip without explicit strict
    "RUF001", # Chinese full-width chars in strings are intentional
    "RUF002", # Chinese full-width chars in docstrings are intentional
    "RUF003", # Chinese full-width chars in comments are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"engine/privacy_pb2*.py" = ["E", "F", "N", "UP"]
"engine/grpc_server.py" = ["N802"]
"engine/classification_grpc.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ─────────────────────────────────────────────────────
[tool.mypy]
# python_version 与运行时下限（requires-python >=3.13）保持一致；
# 3.13 同样兼容 numpy 2.x stub 中的 PEP 695 type 语句。
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
implicit_optional = true
files = ["engine", "tests"]
exclude = [
    "engine/privacy_pb2.*",
    "engine/privacy_pb2_grpc.*",
]

[[tool.mypy.overrides]]
# protobuf 生成模块的属性 mypy 无法识别（生成的描述符动态注入），
# 直接跳过对这两个模块的导入分析，避免从它们导入的模块产生大量 has no attribute 错误。
module = [
    "engine.privacy_pb2",
    "engine.privacy_pb2_grpc",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
# 测试文件以功能验证为主，历史上积累了大量 numpy/pandas/scipy 类型推断问题，
# 本次先忽略以解决 numpy 2.x 兼容的阻塞问题，后续再逐步修复。
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# privacy/dp.py 包含大量 scipy sparse / numpy ndarray 类型推断与 Union 分发问题，
# 短期内难以逐项修复，先忽略以解决 numpy 2.x stub 兼容的阻塞问题。
module = ["engine.privacy.dp"]
ignore_errors = true

# ── pytest + coverage ────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow-running",
    "real_models: marks tests that require downloaded NER/Qwen2-VL models and ML deps (run in a separate process; auto-skip when unavailable)",
    "benchmark: marks performance benchmark tests comparing Metal GPU vs CPU",
]
addopts = "-q --tb=short"

[tool.coverage.run]
source = ["engine"]
omit = [
    "engine/privacy_pb2*",
    "engine/privacy_pb2_grpc*",
    "*/tests/*",
    # 进程入口 / 模型下载脚本：仅含启动与网络下载逻辑，无法在单测中覆盖
    "engine/server.py",
    "engine/gateway/server.py",
    "engine/privacy/download_model.py",
    "engine/privacy/download_ner_model.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
