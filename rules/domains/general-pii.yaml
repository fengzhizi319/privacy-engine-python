# 通用个人信息规则 (GB/T 35273)
domain: "general-pii"
version: "1.0.0"
description: "通用个人信息规则 (GB/T 35273)"

# ==============================================================================
# 1. 普通分类规则 (rules)
# 常用字段包含：id, name, category, level, priority, match_logic, matchers
# ==============================================================================
rules:
  # --- 身份证 ---
  - id: "RULE_PII_IDCARD"
    name: "中国大陆身份证"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    match_logic: "AND"                     # 匹配逻辑: AND (全部匹配) 或 OR (任意匹配)
    matchers:
      - target: "field_value"              # 匹配目标: field_name (字段名), field_value (数据值), 或 both
        operator: "id_card_checksum"       # 校验算法算子
        params: {}

  # --- 手机号 ---
  - id: "RULE_PII_PHONE"
    name: "中国大陆手机号"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    match_logic: "AND"
    matchers:
      - target: "field_value"
        operator: "regex"
        params:
          pattern: "^1[3-9]\\d{9}$"

  # --- 医保卡号 ---
  - id: "RULE_PII_MEDICAL_CARD"
    name: "医保卡号"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 100
    match_logic: "AND"
    matchers:
      - target: "field_value"
        operator: "medical_card_checksum"
        params: {}

  # --- 联系方式/位置字段名 ---
  - id: "RULE_PII_CONTACT"
    name: "联系方式/位置字段"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 50
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: [
            "email", "mail", "address", "addr", "location", "loc", "gps", "coordinate", "position", "轨迹",
            "phone", "mobile", "tel", "telephone", "cellphone", "call", "dh", "lxfs",
            "联系电话", "联系方式", "联系地址", "居住地", "家庭住址", "邮编", "zipcode", "postcode"
          ]
          use_word_boundaries: false

  # --- 生物识别信息 ---
  - id: "RULE_PII_BIOMETRIC"
    name: "生物识别信息"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 50
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: [
            "fingerprint", "voiceprint", "palmprint", "iris", "face", "face_id", "biometric", "dna",
            "retina", "gait", "指纹", "声纹", "掌纹", "虹膜", "人脸", "人像", "生物识别", "步态"
          ]
          use_word_boundaries: false

  # --- 姓名字段 ---
  - id: "RULE_PII_NAME"
    name: "姓名/身份证字段名"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 40
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: [
            "name", "username", "realname", "fullname", "patient_name", "idcard", "identity",
            "id_card", "sfz", "身份证", "身份证号", "passport", "护照", "姓名", "真实姓名", "用户姓名"
          ]
          use_word_boundaries: false

  # --- 银行卡/账号 ---
  - id: "RULE_PII_BANK_CARD"
    name: "银行卡/账户字段名"
    category: "PERSONAL_BASIC"
    level: "L3"
    priority: 50
    match_logic: "AND"
    matchers:
      - target: "field_name"
        operator: "keyword_contains"
        params:
          keywords: [
            "bank_card", "bank_account", "card_no", "account_no", "银行卡", "卡号", "还款账户", "银行账户"
          ]
          use_word_boundaries: false

# ==============================================================================
# 2. 敏感度降级与覆盖规则 (downgrade_rules)
# 可用字段包含：id, name, keywords, level, category, force_suppress, max_force_suppress_level, exempt_rules
# ==============================================================================
downgrade_rules:
  - id: "general-pii:RULE_DOWN_PUBLIC"
    name: "公开数据降级"
    keywords: ["public_report", "annual_summary", "科普", "公开", "public", "notice", "announcement", "公告", "公示"]
    level: "L1"
    category: "PUBLIC_REPORT"
    force_suppress: false                 # 是否开启强制压制 (false=仅做兜底降级)
    max_force_suppress_level: ""          # 压制上限等级 (空=使用 level 字段作为上限)
    exempt_rules: []                      # 压制豁免例外名单 (空=没有例外全额压制)

  - id: "general-pii:RULE_DOWN_OPS"
    name: "运营统计强制降级"
    # 注：移除裸短关键词 "stat"/"cnt"——降级匹配为归一化子串语义（engine._evaluate_downgrade），
    # "stat" 会误伤 "status" 等字段；保留 "statistics"/"stat_count"/"total_cnt" 等复合关键词。
    keywords: [
      "turnover_rate", "device_usage", "inventory", "statistics", "stat_count",
      "total_cnt", "total_num", "stat_num", "门诊人次", "床位统计", "工作量统计", "周转率", "使用率", "库存", "汇总"
    ]
    level: "L2"
    category: "OPERATIONAL_STAT"
    force_suppress: true                  # 是否开启强制压制 (true=强行压制符合条件的普通规则)
    max_force_suppress_level: "L3"        # 覆盖上限等级 (可强行将误报的 L3 降为 L2)
    exempt_rules: ["RULE_PII_BANK_CARD"]  # 银行卡规则豁免强制降级

# ==============================================================================
# 3. 组合/上下文增强规则 (composite_rules)
# 可用字段包含：id, name, field_patterns, min_matches, target_level, category, table_name_pattern, boost_level
# ==============================================================================
composite_rules:
  - id: "COMP_PII_001"
    name: "高敏感个人信息组合"
    field_patterns: ["name", "idcard|identity", "mobile|phone|cell"]
    min_matches: 3
    target_level: "L5"
    category: "COMPOSITE_PII_COMBO"
    table_name_pattern: ""                # 表名匹配正则 (空=不限表名)
    boost_level: ""                       # 提级目标 (空=直接使用 target_level)