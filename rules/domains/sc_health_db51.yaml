domain: sc_health_db51
version: 1.0.0
description: 从文档 四川省健康医疗大数据应用指南.md 自动抽取的分类分级规则包
rules:
- id: RULE_SC_HEALTH_DB51_IDCARD
  name: 身份证件号码检测
  category: PERSONAL_BASIC
  level: L3
  matchers:
  - target: field_value
    operator: id_card_checksum
    params: {}
  - target: field_name
    operator: keyword_contains
    params:
      keywords:
      - idcard
      - sfz
      - identity
      - id_card
      - 身份证
  match_logic: OR
  priority: 90
  enabled: true
  tags: {}
- id: RULE_SC_HEALTH_DB51_PHONE
  name: 手机号码检测
  category: PERSONAL_BASIC
  level: L3
  matchers:
  - target: field_value
    operator: regex
    params:
      pattern: ^1[3-9]\d{9}$
  - target: field_name
    operator: keyword_contains
    params:
      keywords:
      - mobile
      - phone
      - cell
      - 电话
      - 手机
  match_logic: OR
  priority: 80
  enabled: true
  tags: {}
- id: RULE_SC_HEALTH_DB51_BANKCARD
  name: 支付金融账户检测
  category: FINANCIAL_ACCOUNT
  level: L3
  matchers:
  - target: field_value
    operator: luhn_checksum
    params:
      min_length: 13
      max_length: 19
  - target: field_name
    operator: keyword_contains
    params:
      keywords:
      - bankcard
      - cardno
      - card_no
      - bank_card
      - 支付卡号
  match_logic: OR
  priority: 85
  enabled: true
  tags: {}
- id: RULE_SC_HEALTH_DB51_DISEASE
  name: 敏感病种检测
  category: MEDICAL_TREATMENT
  level: L4
  matchers:
  - target: field_name
    operator: keyword_contains
    params:
      keywords:
      - hiv
      - aids
      - std
      - syphilis
      - psychiatric
      - schizophrenia
      - 艾滋病
      - 性病
      - 精神病
  match_logic: AND
  priority: 95
  enabled: true
  tags: {}
- id: RULE_SC_HEALTH_DB51_GENOMIC
  name: 个人遗传基因数据检测
  category: GENOMIC
  level: L5
  matchers:
  - target: field_name
    operator: keyword_contains
    params:
      keywords:
      - gene
      - genomic
      - brca
      - tp53
      - snp
      - cnv
      - chromosome
      - thalassemia
      - 基因
      - 染色体
      - 地中海贫血
  match_logic: AND
  priority: 100
  enabled: true
  tags: {}
downgrade_rules:
- id: DOWN_SC_HEALTH_DB51_OPS
  name: 运营统计指标降级
  keywords:
  - turnover
  - inventory
  - device_usage
  - 开机次数
  - 门诊人次
  - 运行时间
  level: L2
  category: MANAGEMENT
  match_target: field_name
  override: false
  max_force_suppress_level: ''
  exclude_rules: []
composite_rules: []
